<!doctype html>

<head>

<link rel="stylesheet" href="/style.css">

<body>
<div class="app" id="app">
  <button class="burger ghost" id="burger" aria-label="Menu">☰</button>
  <aside class="side" id="side">
    <a class="marque" href="#/"><span class="sceau">DM</span><b>COF <span>DM</span></b></a>
    <button class="fichier" id="fichier" aria-haspopup="menu" hidden><span class="ic">📁</span><span class="u"><small>Fichier</small><b id="univers-nom"></b></span><span class="fl">▾</span></button>

    <select id="choix-univers" aria-label="Univers" hidden></select>
    <button class="cherche" id="ouvrir-recherche"><span>🔍 Rechercher</span><kbd>/</kbd></button>
    <nav id="nav"></nav>
    <div class="bas">
      <button class="etat-lien" id="etat-lien" aria-haspopup="dialog" hidden><span class="voyant" aria-hidden="true"></span><span class="u"><b></b><small></small></span></button>
      <button class="ghost petit maj-badge" id="maj-badge" hidden></button>
      <button class="ghost petit" id="theme" title="Thème clair / sombre">◐ Thème</button>
      <button class="ghost petit" id="deconnexion" title="Fermer la session de cet appareil" hidden>Déconnexion</button>
    </div>
  </aside>
  <main id="vue"></main>
</div>
<div id="apercu" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
