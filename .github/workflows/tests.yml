name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26" # la dernière 1.26.x ; go.mod fixe le minimum
          check-latest: true
      - name: Vérifications
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Code non formaté"; exit 1; }
          go vet -tags "sqlite_fts5 nogui" ./...
          go vet -tags "sqlite_fts5 nogui serveur" .
      - name: Tests
        run: go test -tags "sqlite_fts5 nogui" ./...
      - name: Compilation (sans fenêtre)
        run: CGO_ENABLED=1 go build -tags "sqlite_fts5 nogui" -o /tmp/cof-dm .
      - name: Compilation (édition serveur, celle de l'image Docker)
        run: CGO_ENABLED=1 go build -tags "sqlite_fts5 nogui serveur" -o /tmp/cof-dm-serveur .
